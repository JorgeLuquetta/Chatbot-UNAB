# docker-compose.yml — Chatbot de Apoyo Académico UNAB (VM Ubuntu en la nube)
# Solo n8n publica un puerto hacia el host (9000). mcp-server (8000), guardrails (8080) y
# ollama (11434) son alcanzables únicamente dentro de la red bridge "backend".
# LLM y embeddings: Ollama local y gratuito (qwen2.5:1.5b + granite-embedding:278m). Requiere ~4 GB de RAM.
services:
  n8n:
    image: n8nio/n8n:1.123.0
    restart: always
    ports:
      - "${N8N_BIND:-0.0.0.0}:9000:5678"   # n8n.traumado.top (127.0.0.1 = solo por el túnel)
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:9000/}
      # Sin HTTPS la cookie de sesión no puede ser "Secure" (si no, no se puede entrar a la UI por http://IP:9000)
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      # Permite leer en expresiones SOLO configuración no secreta (IDs, modelo).
      # Los secretos van en credenciales cifradas de n8n (Requirement 15.4).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-Calendario Académico}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID}
      # Cualquier endpoint compatible con OpenAI Chat Completions (por defecto Ollama local)
      - LLM_MODEL=${LLM_MODEL:-unab-llm}
      - LLM_API_URL=${LLM_API_URL:-http://ollama:11434/v1/chat/completions}
      # Modelo del agente IA con herramientas MCP (workflow 11); vacío = LLM_MODEL
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-}
      # Ajustes de velocidad para un LLM en CPU: historial enviado al LLM y largo máximo de la respuesta
      - LLM_HISTORY_MESSAGES=${LLM_HISTORY_MESSAGES:-2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-130}
      # Fragmentos del reglamento que recibe el LLM (antes 5)
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - N8N_RUNNERS_ENABLED=true
      # Token del webhook de ingesta (POST /webhook/ingest con el encabezado x-ingest-token)
      - INGEST_TOKEN=${INGEST_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - backend
    depends_on:
      - mcp-server
      - guardrails
      - ollama

  mcp-server:
    build: ./mcp-server
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - DB_SSL=${DB_SSL:-require}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-ollama}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-granite-embedding:278m}
      - CHUNK_MAX_TOKENS=${CHUNK_MAX_TOKENS:-220}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-30}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - CCD_DATA_DIR=/data/ccd
      # El scraper solo guarda noticias de estos dominios (separados por coma)
      - NEWS_ALLOWED_DOMAINS=${NEWS_ALLOWED_DOMAINS:-unab.edu.co}
      # Correo (envío de noticias e informes). Sin SMTP_HOST se usa Mailpit (bandeja local de prueba).
      # Brevo: SMTP_HOST=smtp-relay.brevo.com SMTP_PORT=587 SMTP_USER=<login SMTP> SMTP_PASSWORD=<clave SMTP>
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-Asistente UNAB <asistente@chatbot-unab.local>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-}
    volumes:
      - ./data/ccd:/data/ccd:ro
      - ./mcp-server/sources.json:/app/sources.json:ro
    expose:
      - "8000"
    networks:
      - backend
    depends_on:
      - ollama

  guardrails:
    build: ./guardrails
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - DB_SSL=${DB_SSL:-require}
      # Segunda capa de validación con LLM (vacío = solo reglas)
      - GUARDRAILS_LLM_URL=${GUARDRAILS_LLM_URL-http://ollama:11434}
      - GUARDRAILS_LLM_MODEL=${GUARDRAILS_LLM_MODEL:-unab-llm}
      # suspicious = el LLM revisa la entrada solo si hay señales de manipulación (always | off)
      - GUARDRAILS_LLM_INPUT=${GUARDRAILS_LLM_INPUT:-suspicious}
      - GUARDRAILS_LLM_TOPIC=${GUARDRAILS_LLM_TOPIC:-on}   # revisa el tema de cada pregunta (~1 s)
    expose:
      - "8080"
    networks:
      - backend
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.12.6
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=-1          # modelos siempre cargados (evita 10-60 s de carga por consulta)
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}    # chat + embeddings (3 si el agente usa otro modelo)
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-2048}   # 2048 basta para el chat; el agente con herramientas MCP necesita 8192
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0      # caché de atención comprimida (menos RAM)
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    networks:
      - backend

  # Descarga los modelos la primera vez (luego termina). Idempotente.
  # Crea "unab-llm" = qwen2.5:1.5b (chat) y "unab-agent" = qwen2.5:3b (agente con herramientas MCP)
  # usando todos los hilos de la CPU (Ollama usa solo los núcleos físicos).
  ollama-pull:
    image: ollama/ollama:0.12.6
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 3 && ollama pull ${LLM_BASE_MODEL:-qwen2.5:1.5b} && ollama pull ${OLLAMA_EMBED_MODEL:-granite-embedding:278m} && printf 'FROM ${LLM_BASE_MODEL:-qwen2.5:1.5b}\nPARAMETER num_thread ${LLM_NUM_THREAD:-2}\n' > /tmp/Modelfile && ollama create unab-llm -f /tmp/Modelfile && ollama pull ${AGENT_BASE_MODEL:-qwen2.5:3b} && printf 'FROM ${AGENT_BASE_MODEL:-qwen2.5:3b}\nPARAMETER num_thread ${LLM_NUM_THREAD:-2}\n' > /tmp/Modelfile2 && ollama create unab-agent -f /tmp/Modelfile2 && echo MODELOS_LISTOS"
    networks:
      - backend
    depends_on:
      - ollama

  # Páginas web: chat sin login (9001) y QR de la app (9002). Solo escuchan en 127.0.0.1:
  # se publican por el túnel de Cloudflare.
  web:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${WEB_BIND:-127.0.0.1}:9001:80"     # chatbotia.traumado.top
      - "${WEB_BIND:-127.0.0.1}:9002:8080"   # qrapp.traumado.top (QR)
      - "${WEB_BIND:-127.0.0.1}:9003:9003"   # portal.traumado.top (inicio con todas las herramientas)
      - "${WEB_BIND:-127.0.0.1}:9004:9004"   # mcp.traumado.top (MCP para Claude / OpenAI, con token)
      - "${WEB_BIND:-127.0.0.1}:8081:8081"   # expoapp.traumado.top (nginx delante de Metro)
    volumes:
      # Se monta la carpeta (no archivos sueltos) para que los cambios se vean sin recrear el contenedor
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Plantilla con el token del MCP: nginx la convierte en /etc/nginx/conf.d/mcp.conf al arrancar
      - ./web/mcp.conf.template:/etc/nginx/templates/mcp.conf.template:ro
    environment:
      - MCP_TOKEN=${MCP_TOKEN:-sin-token-configurado}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    depends_on:
      - n8n
    networks:
      - backend

  # Servidor de Expo (app móvil para Expo Go). Se publica por el túnel en expoapp.traumado.top
  # (Service URL http://localhost:8081, a través de nginx). El QR aparece en qrapp.traumado.top.
  # node_modules vive en un volumen propio (Linux); la carpeta mobile/ del host no se toca.
  expo:
    image: node:22-bookworm-slim
    restart: always
    working_dir: /app
    command: >
      sh -c "cmp -s package-lock.json node_modules/.lock-instalado ||
             (npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock-instalado);
             exec npx expo start --port 8081"
    environment:
      - EXPO_PACKAGER_PROXY_URL=${EXPO_PUBLIC_URL:-https://expoapp.traumado.top}
      - EXPO_PUBLIC_API_URL=${EXPO_API_URL:-https://n8n.traumado.top/webhook}
      - EXPO_NO_TELEMETRY=1
      - EXPO_OFFLINE=1
      - NODE_OPTIONS=--max-old-space-size=1536
    # Sin puerto en el host: lo publica nginx (servicio web) en 127.0.0.1:8081
    volumes:
      - ./mobile:/app
      - expo_node_modules:/app/node_modules
    networks:
      - backend

  # Bandeja de correo de prueba (Mailpit). Recibe lo que envía el asistente cuando no hay SMTP externo.
  # Su interfaz web se ve en el portal: portal.traumado.top/correo/
  mailpit:
    image: axllent/mailpit:v1.21
    restart: always
    environment:
      - MP_WEBROOT=/correo/
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mailpit_data:/data
    expose:
      - "1025"
      - "8025"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mailpit_data:
  expo_node_modules:
  n8n_data:
  ollama_models:
