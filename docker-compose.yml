# docker-compose.yml — Chatbot de Apoyo Académico UNAB (VM Ubuntu en la nube)
# Solo n8n publica un puerto hacia el host (9000). mcp-server (8000), guardrails (8080) y
# ollama (11434) son alcanzables únicamente dentro de la red bridge "backend".
# LLM y embeddings: Ollama local y gratuito (qwen2.5:1.5b + granite-embedding:278m). Requiere ~4 GB de RAM.
services:
  n8n:
    image: n8nio/n8n:1.123.0
    restart: always
    ports:
      - "9000:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:9000/}
      # Sin HTTPS la cookie de sesión no puede ser "Secure" (si no, no se puede entrar a la UI por http://IP:9000)
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      # Permite leer en expresiones SOLO configuración no secreta (IDs, modelo).
      # Los secretos van en credenciales cifradas de n8n (Requirement 15.4).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-Calendario Académico}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID}
      # Cualquier endpoint compatible con OpenAI Chat Completions (por defecto Ollama local)
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:1.5b}
      - LLM_API_URL=${LLM_API_URL:-http://ollama:11434/v1/chat/completions}
      # Ajustes de velocidad para un LLM en CPU: historial enviado al LLM y largo máximo de la respuesta
      - LLM_HISTORY_MESSAGES=${LLM_HISTORY_MESSAGES:-2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-130}
      # Fragmentos del reglamento que recibe el LLM (antes 5)
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - backend
    depends_on:
      - mcp-server
      - guardrails
      - ollama

  mcp-server:
    build: ./mcp-server
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - DB_SSL=${DB_SSL:-require}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-ollama}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-granite-embedding:278m}
      - CHUNK_MAX_TOKENS=${CHUNK_MAX_TOKENS:-220}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-30}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - CCD_DATA_DIR=/data/ccd
    volumes:
      - ./data/ccd:/data/ccd:ro
      - ./mcp-server/sources.json:/app/sources.json:ro
    expose:
      - "8000"
    networks:
      - backend
    depends_on:
      - ollama

  guardrails:
    build: ./guardrails
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - DB_SSL=${DB_SSL:-require}
      # Segunda capa de validación con LLM (vacío = solo reglas)
      - GUARDRAILS_LLM_URL=${GUARDRAILS_LLM_URL-http://ollama:11434}
      - GUARDRAILS_LLM_MODEL=${GUARDRAILS_LLM_MODEL:-qwen2.5:1.5b}
      # suspicious = el LLM revisa la entrada solo si hay señales de manipulación (always | off)
      - GUARDRAILS_LLM_INPUT=${GUARDRAILS_LLM_INPUT:-suspicious}
    expose:
      - "8080"
    networks:
      - backend
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.12.6
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=-1          # modelos siempre cargados (evita 10-60 s de carga por consulta)
      - OLLAMA_MAX_LOADED_MODELS=2    # chat + embeddings
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_CONTEXT_LENGTH=2048     # los prompts recortados caben en 2048 (menos RAM y más rápido)
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0      # caché de atención comprimida (menos RAM)
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    networks:
      - backend

  # Descarga los modelos la primera vez (luego termina). Idempotente.
  ollama-pull:
    image: ollama/ollama:0.12.6
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 3 && ollama pull ${LLM_MODEL:-qwen2.5:1.5b} && ollama pull ${OLLAMA_EMBED_MODEL:-granite-embedding:278m} && echo MODELOS_LISTOS"
    networks:
      - backend
    depends_on:
      - ollama

  # Páginas web: chat sin login (9001) y QR de la app (9002). Solo escuchan en 127.0.0.1:
  # se publican por el túnel de Cloudflare.
  web:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "127.0.0.1:9001:80"     # chat.traumado.top
      - "127.0.0.1:9002:8080"   # app.traumado.top (QR)
      - "127.0.0.1:8081:8081"   # expo.traumado.top (nginx delante de Metro)
    volumes:
      # Se monta la carpeta (no archivos sueltos) para que los cambios se vean sin recrear el contenedor
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
    networks:
      - backend

  # Servidor de Expo (app móvil para Expo Go). Se publica por el túnel en expo.traumado.top
  # (Service URL http://localhost:8081, a través de nginx). El QR aparece en app.traumado.top.
  # node_modules vive en un volumen propio (Linux); la carpeta mobile/ del host no se toca.
  expo:
    image: node:22-bookworm-slim
    restart: always
    working_dir: /app
    command: >
      sh -c "cmp -s package-lock.json node_modules/.lock-instalado ||
             (npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock-instalado);
             exec npx expo start --port 8081"
    environment:
      - EXPO_PACKAGER_PROXY_URL=${EXPO_PUBLIC_URL:-https://expo.traumado.top}
      - EXPO_PUBLIC_API_URL=${EXPO_API_URL:-https://chatbot.traumado.top/webhook}
      - EXPO_NO_TELEMETRY=1
      - EXPO_OFFLINE=1
      - NODE_OPTIONS=--max-old-space-size=1536
    # Sin puerto en el host: lo publica nginx (servicio web) en 127.0.0.1:8081
    volumes:
      - ./mobile:/app
      - expo_node_modules:/app/node_modules
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  expo_node_modules:
  n8n_data:
  ollama_models:
