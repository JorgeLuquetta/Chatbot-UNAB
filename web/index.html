<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ff">
<title>Chatbot UNAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1ff;
    --blob-1: #ffd6e8; --blob-2: #c9e8ff; --blob-3: #d4f5e4; --blob-4: #fff1c9;
    --glass: rgba(255, 255, 255, .62); --glass-strong: rgba(255, 255, 255, .85); --glass-line: rgba(255, 255, 255, .9);
    --text: #2e2645; --muted: #6f6789; --line: #e7defa;
    --lavender: #b9a6f5; --pink: #ffb3cf; --mint: #9fe3c1; --sky: #9fd3ff; --peach: #ffc7a8; --lemon: #ffe58f;
    --brand: #8a6cf0; --brand-deep: #6a4fd6; --on-pastel: #2e2645;
    --me-a: #c9b8ff; --me-b: #ffc2da;
    --bot: rgba(255, 255, 255, .92);
    --warn: #8a3b12; --warn-bg: #ffe4d4; --warn-line: #ffc7a8;
    --shadow: 0 20px 60px -20px rgba(110, 80, 200, .35), 0 4px 16px -6px rgba(110, 80, 200, .18);
    --bubble-shadow: 0 6px 18px -10px rgba(110, 80, 200, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17132a;
      --blob-1: #5a2f55; --blob-2: #24406a; --blob-3: #1f4f45; --blob-4: #5a4a24;
      --glass: rgba(34, 28, 58, .62); --glass-strong: rgba(40, 33, 68, .9); --glass-line: rgba(255, 255, 255, .08);
      --text: #efeaff; --muted: #b3aacf; --line: #3a3160;
      --brand: #b9a6f5; --brand-deep: #d4c8ff;
      --me-a: #b9a6f5; --me-b: #f7a8c8;
      --bot: rgba(52, 44, 86, .92);
      --warn: #ffd2b8; --warn-bg: #4a2d24; --warn-line: #7a4632;
      --shadow: 0 20px 60px -20px rgba(0, 0, 0, .6), 0 4px 16px -6px rgba(0, 0, 0, .4);
      --bubble-shadow: 0 6px 18px -10px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17132a;
    --blob-1: #5a2f55; --blob-2: #24406a; --blob-3: #1f4f45; --blob-4: #5a4a24;
    --glass: rgba(34, 28, 58, .62); --glass-strong: rgba(40, 33, 68, .9); --glass-line: rgba(255, 255, 255, .08);
    --text: #efeaff; --muted: #b3aacf; --line: #3a3160;
    --brand: #b9a6f5; --brand-deep: #d4c8ff;
    --me-a: #b9a6f5; --me-b: #f7a8c8;
    --bot: rgba(52, 44, 86, .92);
    --warn: #ffd2b8; --warn-bg: #4a2d24; --warn-line: #7a4632;
    --shadow: 0 20px 60px -20px rgba(0, 0, 0, .6), 0 4px 16px -6px rgba(0, 0, 0, .4);
    --bubble-shadow: 0 6px 18px -10px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* Fondo: manchas pastel que flotan */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora span { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(60px); opacity: .85; animation: drift 22s ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { background: var(--blob-1); top: -14vmax; left: -10vmax; }
  .aurora span:nth-child(2) { background: var(--blob-2); top: -8vmax; right: -14vmax; animation-delay: -6s; animation-duration: 26s; }
  .aurora span:nth-child(3) { background: var(--blob-3); bottom: -18vmax; left: 10vmax; animation-delay: -12s; animation-duration: 30s; }
  .aurora span:nth-child(4) { background: var(--blob-4); bottom: -14vmax; right: -6vmax; width: 34vmax; height: 34vmax; animation-delay: -3s; }
  .aurora::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(120, 90, 200, .10) 1px, transparent 1px); background-size: 22px 22px; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(6vmax, 4vmax) scale(1.08); }
    100% { transform: translate(-4vmax, 7vmax) scale(.95); }
  }

  .app {
    position: relative; z-index: 1;
    max-width: 820px; height: 100%; height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 14px 14px max(14px, env(safe-area-inset-bottom));
  }
  .shell {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 28px;
    backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    box-shadow: var(--shadow); overflow: hidden;
  }

  /* Encabezado */
  header { display: flex; align-items: center; gap: 14px; padding: 16px 18px 12px; }
  .logo {
    position: relative; width: 48px; height: 48px; flex: none; border-radius: 16px;
    background: conic-gradient(from 210deg, var(--pink), var(--lavender), var(--sky), var(--mint), var(--lemon), var(--pink));
    display: grid; place-items: center; box-shadow: 0 8px 20px -8px rgba(138, 108, 240, .6);
    animation: wobble 6s ease-in-out infinite;
  }
  .logo b { font: 600 22px/1 "Fredoka", "Nunito", sans-serif; color: var(--on-pastel); }
  .logo::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: #5fd39a; border: 3px solid var(--glass-strong); }
  @keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .title { min-width: 0; }
  header h1 { margin: 0; font: 600 20px/1.15 "Fredoka", "Nunito", sans-serif; letter-spacing: .2px; }
  header h1 em { font-style: normal; background: linear-gradient(90deg, var(--brand), #f07aa8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .who {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
    background: var(--glass-strong); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 5px;
    font-size: 13px; max-width: 55%;
  }
  .who[hidden] { display: none; }
  .avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--on-pastel); background: linear-gradient(135deg, var(--mint), var(--sky)); }
  .who-txt { min-width: 0; line-height: 1.25; }
  #whoname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.link { background: none; border: 0; color: var(--brand); cursor: pointer; padding: 0; font: inherit; font-size: 12px; font-weight: 700; }
  button.link:hover { text-decoration: underline; }

  /* Temas */
  .topics { display: flex; gap: 8px; padding: 0 18px 14px; overflow-x: auto; scrollbar-width: none; }
  .topics::-webkit-scrollbar { display: none; }
  .topic { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--on-pastel); }
  .topic i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .7); font-size: 12px; }
  .topic:nth-child(1) { background: var(--lavender); }
  .topic:nth-child(2) { background: var(--mint); }
  .topic:nth-child(3) { background: var(--pink); }
  .topic:nth-child(4) { background: var(--sky); }

  /* Conversación */
  #log {
    flex: 1; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px;
    border-top: 1px solid var(--line); background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .08));
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .msg {
    position: relative; max-width: min(82%, 560px); padding: 11px 15px; border-radius: 20px;
    white-space: pre-wrap; word-wrap: break-word; box-shadow: var(--bubble-shadow);
    animation: pop .35s cubic-bezier(.2, .9, .3, 1.3) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  .me {
    align-self: flex-end; color: var(--on-pastel);
    background: linear-gradient(135deg, var(--me-a), var(--me-b));
    border-bottom-right-radius: 6px; font-weight: 600;
  }
  .bot {
    align-self: flex-start; margin-left: 42px; background: var(--bot); color: var(--text);
    border: 1px solid var(--line); border-bottom-left-radius: 6px;
  }
  .bot::before {
    content: "🎓"; position: absolute; left: -42px; bottom: 0; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 15px;
    background: linear-gradient(135deg, var(--lavender), var(--pink)); box-shadow: var(--bubble-shadow);
  }
  .bot.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .bot.warn::before { content: "⚠️"; background: linear-gradient(135deg, var(--peach), var(--lemon)); }
  .tag {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 2px 10px 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; color: var(--on-pastel); background: var(--mint);
  }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; }

  .typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--lavender); animation: bounce 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { background: var(--pink); animation-delay: .15s; }
  .typing i:nth-child(3) { background: var(--sky); animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .6; } 40% { transform: translateY(-7px); opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; margin-left: 42px; max-width: calc(100% - 42px); animation: pop .4s .1s cubic-bezier(.2, .9, .3, 1.3) both; }
  .chips button {
    border: 0; color: var(--on-pastel); border-radius: 14px; padding: 8px 14px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 700; box-shadow: var(--bubble-shadow);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .chips button:nth-child(4n+1) { background: #e4dbff; }
  .chips button:nth-child(4n+2) { background: #d3f4e3; }
  .chips button:nth-child(4n+3) { background: #ffdbe9; }
  .chips button:nth-child(4n+4) { background: #d6ebff; }
  .chips button:hover { transform: translateY(-2px) rotate(-1deg); filter: saturate(1.3); }
  .chips button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  /* Caja de texto */
  form { display: flex; align-items: center; gap: 8px; margin: 10px 14px 14px; padding: 6px 6px 6px 18px; border-radius: 999px; background: var(--glass-strong); border: 2px solid var(--line); transition: border-color .2s, box-shadow .2s; }
  form:focus-within { border-color: var(--lavender); box-shadow: 0 0 0 5px rgba(185, 166, 245, .3); }
  input { flex: 1; min-width: 0; padding: 10px 0; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; }
  input::placeholder { color: var(--muted); font-weight: 600; }
  input:focus { outline: none; }
  form button {
    display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px 0 18px; border: 0; border-radius: 999px;
    color: var(--on-pastel); font: inherit; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, var(--lavender), var(--pink));
    background-size: 160% 160%; transition: transform .15s, background-position .4s;
  }
  form button:hover { background-position: 100% 0; transform: scale(1.04); }
  form button:active { transform: scale(.97); }
  form button svg { width: 18px; height: 18px; }
  form button:disabled { opacity: .55; cursor: default; transform: none; }
  form button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin: -4px 0 0; padding-bottom: 2px; }

  @media (max-width: 560px) {
    .app { padding: 0; }
    .shell { border-radius: 0; border: 0; }
    header { padding: 12px 16px 10px; gap: 10px; }
    .logo { width: 42px; height: 42px; border-radius: 14px; }
    header p { display: none; }
    .who { padding: 4px 10px 4px 4px; }
    .avatar { width: 30px; height: 30px; }
    .topics { padding: 0 16px 10px; }
    #log { padding: 14px 16px 6px; }
    .msg { max-width: 88%; }
    form { margin: 8px 16px 10px; }
    form button span { display: none; }
    form button { padding: 0; width: 46px; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="app">
  <div class="shell">
    <header>
      <div class="logo" aria-hidden="true"><b>U</b></div>
      <div class="title">
        <h1>Chatbot <em>UNAB</em></h1>
        <p>Tu asistente académico, en línea</p>
      </div>
      <div class="who" id="who" hidden>
        <div class="avatar" id="initials" aria-hidden="true"></div>
        <div class="who-txt">
          <div id="whoname"></div>
          <button class="link" id="change" type="button">Cambiar estudiante</button>
        </div>
      </div>
    </header>
    <div class="topics" aria-label="Temas que conoce el asistente">
      <span class="topic"><i>📘</i>Reglamento</span>
      <span class="topic"><i>🧾</i>Tus cursos</span>
      <span class="topic"><i>📰</i>Noticias</span>
      <span class="topic"><i>📅</i>Calendario</span>
    </div>
    <div id="log" aria-live="polite"></div>
    <form id="chatform" autocomplete="off">
      <input id="msg" placeholder="Escribe tu ID de estudiante…" maxlength="1000" required aria-label="Mensaje">
      <button type="submit" id="send" aria-label="Enviar">
        <span>Enviar</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="hint">Cada respuesta tarda alrededor de 1 minuto ✨</p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const LABELS = { "consulta-general": "Reglamento", "cursos-realizados": "Tu historial", "noticias": "Noticias", "calendario": "Calendario" };
const TAG_COLORS = { "consulta-general": "var(--lavender)", "cursos-realizados": "var(--mint)", "noticias": "var(--pink)", "calendario": "var(--sky)" };
const SUGGESTIONS = ["¿Cuál es mi avance en la carrera?", "¿Qué materias tengo pendientes?", "¿Cuáles son los requisitos de grado?", "¿Qué noticias hay en la universidad?"];
const ID_RE = /\b(U\d{8})\b/i;
let student = null;   // { student_id, full_name, program, current_semester, progress_percentage }
let busy = false;

async function post(path, body, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctrl.signal });
    let data = {};
    try { data = await r.json(); } catch {}
    return { status: r.status, data };
  } finally { clearTimeout(t); }
}

function bubble(text, cls, tag, intent) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (tag) {
    d.appendChild(document.createElement("br"));
    const s = document.createElement("span"); s.className = "tag"; s.textContent = tag;
    if (TAG_COLORS[intent]) s.style.background = TAG_COLORS[intent];
    d.appendChild(s);
  }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function typing() {
  const d = bubble("", "bot typing");
  d.setAttribute("aria-label", "Escribiendo…");
  d.innerHTML = "<i></i><i></i><i></i>";
  return d;
}

function chips(list) {
  const c = document.createElement("div"); c.className = "chips";
  list.forEach((q) => { const b = document.createElement("button"); b.type = "button"; b.textContent = q; b.onclick = () => { c.remove(); handle(q); }; c.appendChild(b); });
  $("log").appendChild(c);
  $("log").scrollTop = $("log").scrollHeight;
}

function firstName(full) { return String(full || "").split(" ")[0]; }
function initials(full) { return String(full || "").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase(); }
function fmtPct(n) { return Number(n || 0).toLocaleString("es-CO", { maximumFractionDigits: 1 }) + " %"; }

function setStudent(s) {
  student = s;
  if (s) {
    store.set("unab_sid", s.student_id);
    $("who").hidden = false; $("whoname").textContent = s.full_name + " · " + s.student_id;
    $("initials").textContent = initials(s.full_name);
    $("msg").placeholder = "Escribe tu pregunta…";
  } else {
    store.del("unab_sid");
    $("who").hidden = true;
    $("msg").placeholder = "Escribe tu ID de estudiante…";
  }
}

function greet() {
  bubble("¡Hola! 👋 Soy el asistente académico de la UNAB.\n\nPuedo ayudarte con el reglamento estudiantil, tus materias y tu avance, las noticias de la universidad y el calendario académico.\n\nPara empezar, escribe tu ID de estudiante (por ejemplo, U00000001).", "bot");
}

function welcome(s, again) {
  const sem = s.current_semester ? s.current_semester + ".º semestre" : "sin materias en curso";
  bubble((again ? "¡Hola de nuevo, " : "¡Listo, te encontré! Hola, ") + firstName(s.full_name) + ".\n\n" +
         "• Programa: " + s.program + "\n• Semestre actual: " + sem + "\n• Avance en la carrera: " + fmtPct(s.progress_percentage) +
         "\n\n¿En qué te puedo ayudar? (Cada respuesta tarda alrededor de 1 minuto.)", "bot");
  chips(SUGGESTIONS);
}

async function lookup(id, silent) {
  const { status, data } = await post("api/student", { student_id: id }, 20000);
  if (status === 200 && data.student_id) return data;
  if (!silent) {
    if (status === 404) bubble("No encontré el ID " + id + " en la base de datos. Revísalo e inténtalo de nuevo.", "bot warn");
    else bubble("No pude consultar la base de datos en este momento. Intenta de nuevo en un momento.", "bot warn");
  }
  return null;
}

async function handle(text) {
  text = text.trim();
  if (busy || !text) return;
  busy = true; $("send").disabled = true;
  bubble(text, "me");
  const wait = typing();
  try {
    if (!student) {
      const m = text.match(ID_RE);
      if (!m) {
        wait.remove();
        bubble("Antes de responder necesito saber quién eres. Escribe tu ID de estudiante: es una U seguida de 8 dígitos, por ejemplo U00000001.", "bot");
        return;
      }
      const s = await lookup(m[1].toUpperCase(), false);
      wait.remove();
      if (s) { setStudent(s); welcome(s, false); }
      return;
    }
    if (/^(cambiar (id|estudiante)|salir|cerrar sesi[oó]n)$/i.test(text)) {
      wait.remove(); setStudent(null);
      bubble("Listo. Escribe el ID del estudiante con el que quieres continuar.", "bot");
      return;
    }
    const started = Date.now();
    const { status, data } = await post("api/chat", { student_id: student.student_id, message: text }, 240000);
    wait.remove();
    const secs = Math.round((Date.now() - started) / 1000);
    if (status === 200 && data.response) bubble(data.response, "bot", (LABELS[data.intent] || "Respuesta") + " · " + secs + " s", data.intent);
    else if (status === 400) bubble(data.error || "Solo puedo ayudarte con temas académicos de la UNAB.", "bot warn");
    else if (status === 401) { setStudent(null); bubble("No encontré tu ID en la base de datos. Escríbelo de nuevo.", "bot warn"); }
    else if ([502, 503, 504, 522, 524].includes(status)) bubble("El asistente está ocupado o tardó demasiado en responder (puede estar atendiendo otra pregunta). Espera unos segundos y vuelve a intentarlo.", "bot warn");
    else if (status === 404) bubble("El asistente se está reiniciando. Intenta de nuevo en un minuto.", "bot warn");
    else bubble(data.error || ("No pude responder (código " + status + "). Intenta de nuevo."), "bot warn");
  } catch (e) {
    wait.remove();
    bubble("Se agotó el tiempo de espera o falló la conexión. Intenta de nuevo.", "bot warn");
  } finally { busy = false; $("send").disabled = false; $("msg").focus(); }
}

$("chatform").onsubmit = (e) => { e.preventDefault(); const v = $("msg").value; $("msg").value = ""; handle(v); };
$("change").onclick = () => { setStudent(null); bubble("Escribe el ID del estudiante con el que quieres continuar.", "bot"); $("msg").focus(); };

(async () => {
  const saved = store.get("unab_sid");
  if (saved) {
    const s = await lookup(saved, true).catch(() => null);
    if (s) { setStudent(s); welcome(s, true); $("msg").focus(); return; }
  }
  greet(); $("msg").focus();
})();
</script>
