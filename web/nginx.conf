# Página del chat (sin login) + proxy SOLO al webhook de chat de n8n.
# Se publica por el túnel de Cloudflare con Service URL http://localhost:9001
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # El navegador llama a /api/chat (mismo origen, sin CORS) y nginx lo pasa a n8n.
    location = /api/chat {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678/webhook/chat;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization "";
        # El LLM en CPU puede tardar 1-2 minutos
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Búsqueda del estudiante por ID (saludo inicial del chat)
    location = /api/student {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678/webhook/student-lookup;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
    }

    # La página de QR también en chat.traumado.top/app (por si app.traumado.top no está configurado)
    location = /app {
        try_files /app.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /expo-status {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $expo http://expo:8081;
        proxy_pass $expo/status;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location / { return 404; }
}

# Página con los QR para abrir el chatbot en el celular (app.traumado.top).
# Se publica por el túnel con Service URL http://localhost:9002
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /app.html =404;
        add_header Cache-Control "no-cache";
    }
    # ¿Está corriendo el servidor de Expo? (Metro responde "packager-status:running")
    location = /expo-status {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $expo http://expo:8081;
        proxy_pass $expo/status;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }
    location / { return 404; }
}

# Delante del servidor de Expo (expo.traumado.top → http://localhost:8081).
# Expo Go envía el encabezado "expo-platform" y pasa directo a Metro.
# Un navegador que abre la raíz se redirige a la página con el QR.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8081;
    server_name _;
    client_max_body_size 20m;

    location = / {
        if ($http_expo_platform = "") { return 302 https://app.traumado.top/; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $metro http://expo:8081;
        proxy_pass $metro;
        proxy_set_header Host $host;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $metro http://expo:8081;
        proxy_pass $metro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
